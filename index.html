
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyberfall | Sniper Protocol</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="game-wrapper">
        <header class="game-header">
            <h1>CYBERFALL</h1>
            <p class="subtitle">SNIPER PROTOCOL // NIGHT WATCH</p>
        </header>

        <section id="game-area" aria-label="Cyberfall game">

            <!-- Scope view: the distant city is visible inside this circle -->
            <div id="scope-view">

                <div class="city-sky"></div>

                <!-- Distant background buildings -->
                <div class="background-building building-left">
                    <span></span><span></span><span></span>
                    <span></span><span></span><span></span>
                </div>

                <div class="background-building building-right">
                    <span></span><span></span><span></span>
                    <span></span><span></span><span></span>
                </div>

                <!-- Main target building -->
                <div id="main-building">
                    <div class="roof"></div>

                    <div class="building-windows">
                        <span></span><span></span><span></span><span></span>
                        <span></span><span></span><span></span><span></span>
                        <span></span><span></span><span></span><span></span>
                    </div>
                </div>

                <div class="city-horizon"></div>

                <!-- Gameplay alien -->
                <div id="fruit" aria-label="Alien target">👽</div>

                <!-- Jumpscare alien -->
                <div id="jumpscare-alien" aria-hidden="true">👽</div>

            </div>

            <!-- Scope boundary and dark mask -->
            <div class="scope-mask" aria-hidden="true"></div>

            <!-- HUD: stays above the scope and mask -->
            <div class="hud">
                <div id="score">Score: 0</div>
                <div id="misses">Misses: 0</div>
                <div id="lives">Lives: ❤️❤️❤️❤️</div>
            </div>

            <!-- Mouse-controlled sniper reticle -->
            <div id="crosshair" aria-hidden="true">
                <div class="crosshair-circle"></div>
                <div class="crosshair-horizontal"></div>
                <div class="crosshair-vertical"></div>
                <div class="crosshair-center"></div>
            </div>

            <!-- Game Over overlay -->
            <div id="game-over">
                <div class="danger-symbol">☣</div>
                <div class="system-warning">⚠ SYSTEM FAILURE ⚠</div>
                <h2>GAME OVER</h2>
                <div class="game-over-line"></div>
                <p class="game-over-message">SNIPER CONNECTION LOST</p>
                <button id="restart-button" type="button">RESTART</button>
            </div>

        </section>

        <footer class="game-footer">
            <span>THREAT DETECTION: ACTIVE</span>
            <span>PROTOCOL: CYBERFALL</span>
        </footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
