<!DOCTYPE html>
<html>

<head>
    <title>Cyberfall</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>CYBERFALL</h1>

    <p id="score">Score: 0</p>
    <p id="misses">Misses: 0</p>
    <p id="lives">Lives: ❤️❤️❤️❤️</p>

    <div id="game-area">

        <div id="scope-view">

            <div id="building-back-1"></div>
            <div id="building-back-2"></div>

            <div id="building">
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
            </div>

            <!-- Normal gameplay alien -->
            <div id="fruit">👽</div>

            <!-- Final jumpscare alien -->
            <div id="jumpscare-alien">👽</div>

        </div>


        <!-- Sniper reticle -->
        <div id="crosshair">
            <div class="crosshair-circle"></div>
            <div class="crosshair-center">+</div>
        </div>


        <!-- Bomb -->
        <div id="bomb">💣</div>


        <!-- Cyber Game Over -->
        <div id="game-over">

            <div class="danger-symbol">☠</div>

            <div class="system-warning">
                SYSTEM FAILURE
            </div>

            <h2>GAME OVER</h2>

            <div class="game-over-line"></div>

            <button id="restart-button">
                RESTART
            </button>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
