<!DOCTYPE html> <!-- Tells the browser this is an HTML5 document -->
<html> <!-- Root element of the entire HTML document -->
<head> <!-- Contains information about the webpage -->
    <title>Fruit Slash</title> <!-- The title shown in the browser tab -->
    <link rel="stylesheet" href="style.css"> <!-- Connects our CSS file to the HTML -->
</head> <!-- Ends the head section -->

<body> <!-- Contains everything visible on the webpage -->
    <h1>Fruit Slash</h1> <!-- Main heading of the game -->
    
    <p id="score">Score: 0</p>
    <p id="misses">Misses: 0</p> <!-- Displays how many fruits the player has missed -->
    <p id="lives">Lives: ❤️❤️❤️❤️</p>
    
    <div id="game-area">
        <div id="fruit">🍎</div>

        <div id="game-over">
            <h2>Game Over!</h2>
            <button id="restart-button">Play Again</button>
        </div>
    </div>

    <script src="script.js"></script> <!-- Connects our JavaScript file -->

</body> <!-- Ends the visible webpage content -->

</html> <!-- Ends the entire HTML document -->
